name: Android Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Small signed APK for sideload/testing
      - name: Build signed ARM64 APK
        run: ./gradlew assembleArm64Release

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: arm64-release-apk
          path: app/build/outputs/apk/arm64/release/*.apk
